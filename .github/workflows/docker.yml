name: Docker

on:
  push:
    branches: ["**"]
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "docker-compose.yml"
      - "requirements.txt"
      - "frontend/Dockerfile"
      - "frontend/nginx.conf"
      - "frontend/package*.json"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "docker-compose.yml"
      - "requirements.txt"
      - "frontend/Dockerfile"
      - "frontend/nginx.conf"
      - "frontend/package*.json"
      - ".github/workflows/docker.yml"

jobs:
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: churn-engine-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Not just "does it build" - actually runs it and hits the real
      # health endpoint, the same discipline this project applies to every
      # other change (verify live, don't assume-correct). Catches the real
      # failure mode this workflow exists for: a runtime data file the
      # Dockerfile forgot to COPY (this happened once already - see the
      # Dockerfile's comment on telco_enriched.csv/hillstrom.csv) would
      # build fine and then 500 at request time, which a build-only check
      # would never catch.
      - name: Run container and check /health
        run: |
          docker run -d --name backend-ci -p 8000:8000 churn-engine-backend:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "backend never became healthy"
          docker logs backend-ci
          exit 1

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs backend-ci || true

  frontend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: churn-engine-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and check root page
        run: |
          docker run -d --name frontend-ci -p 5173:80 churn-engine-frontend:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5173/ >/dev/null; then
              echo "frontend serving"
              exit 0
            fi
            sleep 2
          done
          echo "frontend never came up"
          docker logs frontend-ci
          exit 1

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs frontend-ci || true
