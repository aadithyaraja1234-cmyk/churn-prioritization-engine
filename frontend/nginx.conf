# Serves the SPA build. `try_files ... /index.html` is the one thing that
# actually matters here: React Router handles routes like /analytics or
# /customer-360 client-side, but there's no real file at those paths - a
# direct request or a page refresh on one (nginx's default behavior) would
# 404 without this fallback, same class of bug the app's own NotFound page
# fix addressed client-side.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for content-hashed build assets (Vite names them
    # with a hash, so a new deploy naturally gets new filenames - safe to
    # cache aggressively). index.html itself is NOT matched by this glob
    # (it has no hash in its name) and keeps nginx's default caching, so a
    # new deploy is picked up on next load rather than needing a cache bust.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
